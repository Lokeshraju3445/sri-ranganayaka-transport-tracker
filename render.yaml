services:
  - type: web
    name: sri-ranganayaka-transport
    env: node
    plan: starter
    buildCommand: npm install && npm run check:env && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: ADMIN_API_KEY
        sync: false
